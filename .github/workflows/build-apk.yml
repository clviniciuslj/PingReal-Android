
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Inspect Android manifests
        run: |
          echo "=== MANIFESTO PRINCIPAL ==="
          cat -n app/src/main/AndroidManifest.xml

          echo "=== VALIDACAO XML ==="
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "app/src/main/AndroidManifest.xml"
          try:
              ET.parse(path)
              print("XML valido")
          except ET.ParseError as e:
              print(f"ERRO XML: {e}")
              raise
          PY

          echo "=== TODOS OS MANIFESTOS ==="
          find . -name AndroidManifest.xml -type f

      - name: Build APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PingReal-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
